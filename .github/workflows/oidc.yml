name: oidc-probe
on: pull_request_target
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: decode oidc claims
        run: |
          echo "REQ_URL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "REQ_TOKEN_SET=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))")
          echo "TOKEN_LEN=${#TOKEN}"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool
