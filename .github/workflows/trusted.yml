name: trusted-restore
on:
  push:
    branches: [main]
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: restore poison-pr
        id: c
        uses: actions/cache@v4
        with:
          path: probe-dir
          key: poison-pr
      - name: show
        run: |
          echo "HIT=${{ steps.c.outputs.cache-hit }}"
          echo "=== RESTORED ==="; cat probe-dir/payload.txt 2>/dev/null || echo "(no payload)"
